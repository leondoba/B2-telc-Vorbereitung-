name: apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le dossier www
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            if [ -f index.html ]; then
              cp index.html www/index.html
            else
              echo "::error::index.html introuvable. Mets-le à la racine du dépôt ou dans le dossier www/."
              ls -la
              exit 1
            fi
          fi
          ls -la www

      - name: Installer les dépendances
        run: |
          if [ ! -f package.json ]; then
            npm init -y
            npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          else
            npm install
          fi

      - name: Créer la configuration Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.leophysio.telcb2",
            "appName": "TELC B2",
            "webDir": "www",
            "android": { "allowMixedContent": true }
          }
          JSON
          fi
          cat capacitor.config.json

      - name: Créer le projet Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Synchroniser le site web dans l'app
        run: npx cap sync android

      - name: Compiler l'APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
